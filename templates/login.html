<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Insurance Policy Tracker</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0f2f5; }
        .card { width: min(420px, calc(100% - 32px)); background: white; padding: 28px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
        h1 { color: #003366; font-size: 22px; margin: 0 0 8px; }
        p { color: #666; font-size: 14px; }
        label { display: block; color: #444; font-size: 13px; font-weight: bold; margin: 16px 0 5px; }
        input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 5px; background: #003366; color: white; font-weight: bold; cursor: pointer; }
        .error { padding: 10px; border-radius: 5px; background: #f8d7da; color: #721c24; font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Insurance Policy Tracker</h1>
        <p>Sign in to access policy operations.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
